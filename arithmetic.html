<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Простая арифметика | Мини-игры</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="game-page">
        <div class="game-page__container">
            <a href="index.html#game-2" class="game-page__back">← Назад к играм</a>

            <div class="game-page__card">
                <h1 class="game-page__title">Простая арифметика</h1>
                <p class="game-page__description">
                    Решайте случайные примеры на сложение, вычитание, умножение и деление.
                    Нажмите «Ответить», введите результат в появившемся окне и узнайте, правильно ли вы посчитали.
                </p>

                <p class="game-page__task"></p>

                <div class="game-page__actions">
                    <button class="game-page__button game-page__button--new" type="button">Новая задача</button>
                    <button class="game-page__button game-page__button--answer" type="button">Ответить</button>
                </div>

                <p class="game-page__message"></p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p class="footer__text">Все права защищены.</p>
    </footer>

    <script src="js/arithmetic.js"></script>
</body>
</html>
